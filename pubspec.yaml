name: foodly
description: Foodly, a small food-ordering app that huntingdogs tests on every pull request.
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  go_router: ^17.3.0
  huntingdogs:
    git:
      url: https://github.com/huntingdogsai/huntingdogs-flutter.git
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  # The Material icon font: without it every icon shows as a box (found by the first hosted run).
  uses-material-design: true
  assets:
    - assets/operator/appmap.json
    - assets/operator/appmap-manifest.json
